name: Android release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build cmake python3-pil zip
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018'
      - name: Version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "name=0.2.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "code=$((20000 + RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            build-android-deps
            build-decomp-pokebw2
            build-decomp-pokew2
            build-decomp-aletheia
          key: android-deps-v1-${{ hashFiles('tools/android/build_all.sh') }}
          restore-keys: android-deps-v1-
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          key = os.environ['SIGNING_KEY']
          if not key:
              raise SystemExit('ANDROID_SIGNING_KEY must be configured to keep APK updates compatible')
          json.loads(key)
          path = Path('build/android-signing.json')
          path.parent.mkdir(exist_ok=True)
          path.write_text(key)
          path.chmod(0o600)
          PY
      - name: Build signed APK
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          SSR_ANDROID_ABIS: arm64-v8a
          SSR_ANDROID_KEY: ${{ github.workspace }}/build/android-signing.json
          SSR_VERSION: ${{ steps.version.outputs.name }}
          SSR_VERSION_CODE: ${{ steps.version.outputs.code }}
          SSR_BUILD_JOBS: '2'
        run: bash tools/android/build_all.sh
      - name: Checksums
        working-directory: build-android-dist
        run: sha256sum pokemon-ds-wide-android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-ds-wide-android-${{ steps.version.outputs.name }}
          path: |
            build-android-dist/pokemon-ds-wide-android.apk
            build-android-dist/SHA256SUMS.txt
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          COMMIT: ${{ github.sha }}
        run: |
          printf 'Android build **%s**. Commit: `%s`.\n\nInstall the APK and select the folder containing your own ROMs. No game files are included.\n' "$VERSION" "$COMMIT" > build/release-notes.md
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" build-android-dist/pokemon-ds-wide-android.apk build-android-dist/SHA256SUMS.txt --clobber
          else
            gh release create "v$VERSION" --target "$COMMIT" --title "Android v$VERSION" --notes-file build/release-notes.md --latest=false build-android-dist/pokemon-ds-wide-android.apk build-android-dist/SHA256SUMS.txt
          fi
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$COMMIT" ]; then
            gh release edit "v$VERSION" --latest
          fi
